syntax = "proto3";

package app.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/edgorman/webapp-template/services/backend/internal/gen/app/v1;appv1";

// User is a profile as anybody may read it - what `GET /users/{username}` answers with.
//
// It is the wire shape, not entity.User: the account's id is never public, so it has no field
// here at all. See `packages/protos/AGENTS.md`'s "Contract Layer" for why protos model the wire
// rather than the domain.
message User {
  // The whole of a profile's public identity: both the handle it is looked up by and the name
  // readers see. There is deliberately no separate display name.
  string username = 1;
  string bio = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

// CurrentUser is the caller's own profile - what `GET /users/me` and `PUT /users/me` answer with.
//
// The profile fields are repeated here rather than nested under a `User` field because the wire
// is flat, and proto3 cannot express embedding. Renaming a profile field means editing both
// messages, and the drift check is what catches forgetting to.
message CurrentUser {
  string id = 1;
  string username = 2;
  string bio = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// UpdateCurrentUserRequest is the body of `PUT /users/me` - the client-settable half of a profile.
// The id comes from the verified token and the timestamps from the server, so neither is here.
message UpdateCurrentUserRequest {
  // Optional so an omitted username is distinguishable from one explicitly set to "": the first
  // keeps the name the profile holds (or draws one for a new profile), the second is a name
  // SetUsername rejects.
  optional string username = 1;
  string bio = 2;
}
